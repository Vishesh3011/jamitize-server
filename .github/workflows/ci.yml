name: Basic CI

on:
  push:
    branches:
      - learning/github-actions
  pull_request:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List repository files
        run: ls -la
      
      - name: Print a message
        run: echo "Repo successfully checked out!"
