name: Basic CI

on:
  push:
    branches:
      - main
      - learning/github-actions
  pull_request:

jobs:
  run_tests:
    runs-on: ubuntu-latest
    services:
        mongodb:
          image: mongo:7
          ports:
            - 27017:27017
          env:
            MONGO_INITDB_DATABASE: jamitizedb
            MONGO_INITDB_ROOT_USERNAME: jamitize-user
            MONGO_INITDB_ROOT_PASSWORD: jamitize-user
          options: >-
            --health-cmd="mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
            --health-interval=10s
            --health-timeout=5s
            --health-retries=5
          

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      
      - name: Verify Go Installation
        run:  |
          go version
          go env GOPATH

      - name: Install Go Dependencies
        run: go mod download
      
      - name: Create application database user
        run: |
          CONTAINER_ID=$(docker ps --filter "ancestor=mongo:7" --format "{{.ID}}" | head -n 1)

          docker exec -i "$CONTAINER_ID" mongosh \
            -u jamitize-user \
            -p jamitize-user \
            --authenticationDatabase admin <<'EOF'
          use jamitizedb
          db.createUser({
            user: "jamitize-user",
            pwd: "jamitize-user",
            roles: [
              { role: "readWrite", db: "jamitizedb" }
            ]
          })
          EOF
      
      - name: Initialize schema
        run: |
          CONTAINER_ID=$(docker ps --filter "ancestor=mongo:7" --format "{{.ID}}" | head -n 1)
          docker exec -i "$CONTAINER_ID" mongosh \
            "mongodb://jamitize-user:jamitize-user@localhost:27017/jamitizedb?authSource=admin" \
            < db/schema.js

      - name: Check formatting
        run: |
            unformatted=$(gofmt -l .)
            if [ -n "$unformatted" ]; then
              echo "The following files are not formatted:"
              echo "$unformatted"
              exit 1
            fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        env:
          ENVIRONMENT: dev
          MONGODB_HOST: localhost
          MONGODB_PORT: "27017"
          MONGODB_DATABASE: jamitizedb
          MONGODB_USERNAME: jamitize-user
          MONGODB_PASSWORD: jamitize-user
          JWT_SECRET: test-secret
          LOG_URL: ""
        run: go test ./...

  run_docker:
    runs-on: ubuntu-latest
    needs: run_tests
    steps:
      - uses: actions/checkout@v4

      - name: Create temporary .env
        run: |
          cat > .env <<EOF
          ENVIRONMENT=prod
          MONGODB_HOST=mongodb
          MONGODB_PORT=27017
          MONGODB_DATABASE=jamitizedb
          MONGODB_USERNAME=root
          MONGODB_PASSWORD=rootpassword
          JWT_SECRET=test-secret
          LOG_URL=
          EOF

      - name: Build Docker image
        run: docker build -t jamitize-server .
      
      - name: Display Docker image size
        run: docker images jamitize-server --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

      - name: Start container
        run: docker compose -f docker-compose-prod.yml up -d

      - name: Show the running containers
        run: docker compose -f docker-compose-prod.yml ps
      
      - name: Wait for API health check
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8080/apis/health; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 2
          done
          echo "API did not become healthy"
          exit 1

      - name: Show logs
        if: always()
        run: docker compose -f docker-compose-prod.yml logs --tail=100
      
      - name: Stop running containers
        if: always()
        run: docker compose -f docker-compose-prod.yml down -v
      
