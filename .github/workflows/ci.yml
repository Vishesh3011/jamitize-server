name: Basic CI

on:
  push:
    branches:
      - learning/github-actions
  pull_request:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      
      - name: Verify Go Installation
        run:  |
          go version
          go env GOPATH

      - name: Install Go Dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...
